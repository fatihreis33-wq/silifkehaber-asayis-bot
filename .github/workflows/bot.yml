name: Asayis Bot (Draft)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm start
        env:
          WP_BASE: ${{ secrets.WP_BASE }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
